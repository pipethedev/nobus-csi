apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nobus-csi.fullname" . }}-controller
  namespace: {{ include "nobus-csi.namespace" . }}
  labels:
    {{- include "nobus-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nobus-csi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "nobus-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "nobus-csi.controllerServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nobus-csi
          image: {{ include "nobus-csi.controllerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-endpoint=unix:///csi/csi.sock"
            - "-mode=controller"
          envFrom:
            - secretRef:
                name: {{ include "nobus-csi.secretName" . }}
          volumeMounts:
            - name: socket
              mountPath: /csi
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.provisioner.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.attacher.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.resizer.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.snapshotter.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.livenessProbe.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        - name: socket
          emptyDir: {}
