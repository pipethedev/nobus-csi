apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nobus-csi.fullname" . }}-node
  namespace: {{ include "nobus-csi.namespace" . }}
  labels:
    {{- include "nobus-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nobus-csi.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "nobus-csi.labels" . | nindent 8 }}
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: {{ include "nobus-csi.nodeServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nobus-csi
          image: {{ include "nobus-csi.nodeImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          args:
            - "-endpoint=unix:///csi/csi.sock"
            - "-mode=node"
          envFrom:
            - secretRef:
                name: {{ include "nobus-csi.secretName" . }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-dir
              mountPath: {{ .Values.node.kubeletRootDir }}
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: udev
              mountPath: /run/udev
          {{- with .Values.node.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: node-driver-registrar
          image: {{ .Values.sidecars.registrar.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path={{ .Values.node.pluginDir }}/csi.sock"
            {{- range .Values.sidecars.registrar.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ .Values.sidecars.livenessProbe.image }}
          args:
            - "--csi-address=/csi/csi.sock"
            {{- range .Values.sidecars.livenessProbe.args }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ .Values.node.pluginDir }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.registrarDir }}
            type: Directory
        - name: pods-dir
          hostPath:
            path: {{ .Values.node.kubeletRootDir }}
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: udev
          hostPath:
            path: /run/udev
            type: Directory
