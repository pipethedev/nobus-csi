{{- if .Values.volumeSnapshotClass.create }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.volumeSnapshotClass.name }}
  labels:
    {{- include "nobus-csi.labels" . | nindent 4 }}
  {{- with .Values.volumeSnapshotClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
driver: {{ .Values.driver.name }}
deletionPolicy: {{ .Values.volumeSnapshotClass.deletionPolicy }}
parameters:
  csi.storage.k8s.io/snapshotter-secret-name: {{ include "nobus-csi.secretName" . | quote }}
  csi.storage.k8s.io/snapshotter-secret-namespace: {{ include "nobus-csi.namespace" . | quote }}
  {{- with .Values.volumeSnapshotClass.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
