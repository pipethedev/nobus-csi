{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "nobus-csi.labels" . | nindent 4 }}
  {{- with .Values.storageClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
provisioner: {{ .Values.driver.name }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
parameters:
  project_id: {{ required "nobus.projectId is required" .Values.nobus.projectId | quote }}
  availability_zone: {{ required "nobus.availabilityZone is required" .Values.nobus.availabilityZone | quote }}
  {{- if .Values.nobus.volumeType }}
  volume_type: {{ .Values.nobus.volumeType | quote }}
  {{- end }}
  csi.storage.k8s.io/provisioner-secret-name: {{ include "nobus-csi.secretName" . | quote }}
  csi.storage.k8s.io/provisioner-secret-namespace: {{ include "nobus-csi.namespace" . | quote }}
  csi.storage.k8s.io/controller-publish-secret-name: {{ include "nobus-csi.secretName" . | quote }}
  csi.storage.k8s.io/controller-publish-secret-namespace: {{ include "nobus-csi.namespace" . | quote }}
  csi.storage.k8s.io/controller-expand-secret-name: {{ include "nobus-csi.secretName" . | quote }}
  csi.storage.k8s.io/controller-expand-secret-namespace: {{ include "nobus-csi.namespace" . | quote }}
  {{- with .Values.storageClass.parameters }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
